name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.3.0)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Node 24 LTS)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Download dataset from release
        run: |
          mkdir -p web/public/data
          curl -fsSL https://github.com/maxisoft-vibe/concept-cards/releases/download/data/words.json -o web/public/data/words.json

      - name: Build Angular web app
        working-directory: ./web
        run: npm run build:gh-pages

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Synchronize Capacitor Android
        working-directory: ./web
        run: npx cap sync android

      - name: Build Android Release APK
        working-directory: ./web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "main" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v1.0.0"
          fi
          
          SRC_APK="web/android/app/build/outputs/apk/release/app-release.apk"
          DEST_APK="concept-cards-${RELEASE_TAG}.apk"
          cp "$SRC_APK" "$DEST_APK"
          
          # Generate SHA256 Checksum
          sha256sum "$DEST_APK" > "${DEST_APK}.sha256"
          
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=${DEST_APK}" >> $GITHUB_OUTPUT
          echo "sha_path=${DEST_APK}.sha256" >> $GITHUB_OUTPUT

      - name: Attest APK Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.prepare_asset.outputs.apk_path }}
            ${{ steps.prepare_asset.outputs.sha_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag }}
          name: "Concept Cards ${{ steps.prepare_asset.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.prepare_asset.outputs.apk_path }}
            ${{ steps.prepare_asset.outputs.sha_path }}

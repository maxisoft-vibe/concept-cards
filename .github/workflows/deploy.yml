name: Deploy Angular App to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Node 24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Download dataset from release
        run: |
          mkdir -p web/public/data
          curl -fsSL https://github.com/maxisoft-vibe/concept-cards/releases/download/data/words.json -o web/public/data/words.json

      - name: Code Quality & Lint
        working-directory: ./web
        run: npm run lint

      - name: Strict Type Check
        working-directory: ./web
        run: npm run type-check

      - name: Run Tests (Vitest)
        working-directory: ./web
        run: npm test

      - name: Build Angular app
        working-directory: ./web
        run: npm run build:gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist/web/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

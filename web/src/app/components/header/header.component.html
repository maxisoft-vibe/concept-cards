<header class="app-header">
  <div class="header-container">
    <!-- Brand Logo -->
    <a routerLink="/" class="brand-logo">
      <div class="logo-badge">
        <span class="q-mark">?</span>
      </div>
      <div class="brand-text">
        <span class="brand-title">CONCEPT</span>
        <span class="brand-subtitle">Générateur de Cartes</span>
      </div>
    </a>

    <!-- Navigation Tabs -->
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <span class="nav-icon">🎴</span>
        <span class="nav-label">Générateur</span>
      </a>
      <a routerLink="/explorer" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">Dictionnaire</span>
      </a>
    </nav>

    <!-- Stats, Theme & Offline Badges -->
    <div class="header-status">
      <!-- Offline Badge -->
      <span *ngIf="isOffline()" class="status-pill offline" title="Mode hors-ligne actif (PWA Cache)">
        <span class="status-dot offline-dot"></span>
        Hors-ligne
      </span>

      <!-- Word Counter Pill -->
      <span *ngIf="!isOffline() && storage.isLoaded()" class="status-pill" [title]="'Source locale : ' + storage.loadSource()">
        <span class="status-dot"></span>
        {{ storage.totalWordsCount() | number }} mots
      </span>

      <!-- Theme Switcher Button -->
      <button 
        class="theme-toggle-btn" 
        (click)="themeService.toggleTheme()" 
        [title]="themeService.isDark() ? 'Passer en mode clair' : 'Passer en mode sombre'"
        aria-label="Basculer le thème clair / sombre">
        <span *ngIf="themeService.isDark()" class="theme-icon">☀️</span>
        <span *ngIf="!themeService.isDark()" class="theme-icon">🌙</span>
      </button>
    </div>
  </div>
</header>

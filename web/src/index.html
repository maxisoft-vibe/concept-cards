<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Concept - Générateur de Cartes</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Générateur infini de cartes pour le jeu de société Concept (6 175 mots curatés, 100% hors-ligne).">
  <meta name="theme-color" content="#0284c7">
  
  <!-- Mobile & PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Concept">
  
  <!-- High Resolution Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Polyfills for Android System WebView < 93 (e.g. Chrome 87 / Android 7-11)
    if (typeof Object.hasOwn === 'undefined') {
      Object.hasOwn = function(obj, prop) {
        return Object.prototype.hasOwnProperty.call(obj, prop);
      };
    }
    if (!Array.prototype.at) {
      Array.prototype.at = function(n) {
        n = Math.trunc(n) || 0;
        if (n < 0) n += this.length;
        if (n < 0 || n >= this.length) return undefined;
        return this[n];
      };
    }
    if (!String.prototype.replaceAll) {
      String.prototype.replaceAll = function(str, newStr) {
        if (Object.prototype.toString.call(str).toLowerCase() === '[object regexp]') {
          return this.replace(str, newStr);
        }
        return this.replace(new RegExp(str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), newStr);
      };
    }

    window.onerror = function(msg, url, line, col, error) {
      console.error('[UNCAUGHT ERROR]', msg, 'at', url, line + ':' + col, error);
    };
    console.log('[Concept] HTML Head & Polyfills loaded.');
  </script>
</head>
<body>
  <app-root></app-root>
  
  <!-- Service Worker Registration for Offline / PWA Support (Web only) -->
  <script>
    if ('serviceWorker' in navigator && (!window.Capacitor || !window.Capacitor.isNativePlatform())) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(function(reg) {
            console.log('[PWA] Service Worker registered successfully, scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>

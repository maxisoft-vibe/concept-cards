<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Concept - Générateur de Cartes</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Générateur infini de cartes pour le jeu de société Concept (6 175 mots curatés, 100% hors-ligne).">
  <meta name="theme-color" content="#0284c7">
  
  <!-- Mobile & PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Concept">
  
  <!-- High Resolution Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  
  <!-- Service Worker Registration for Offline / PWA Support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(function(reg) {
            console.log('[PWA] Service Worker registered successfully, scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>

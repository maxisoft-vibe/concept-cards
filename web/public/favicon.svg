<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Concept Physical Card Representation -->
  <g transform="translate(106, 68)" filter="url(#cardShadow)">
    <!-- White Card Body -->
    <rect width="300" height="376" rx="38" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="4" />
    
    <!-- Inner Card Guideline -->
    <rect x="18" y="18" width="264" height="340" rx="26" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 6" />

    <!-- 🔵 Easy Section Accent -->
    <rect x="34" y="34" width="232" height="88" rx="16" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="4" />
    <circle cx="58" cy="78" r="14" fill="#0ea5e9" />
    <text x="58" y="83" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" text-anchor="middle">1</text>
    <rect x="84" y="66" width="130" height="8" rx="4" fill="#0ea5e9" opacity="0.85" />
    <rect x="84" y="82" width="90" height="6" rx="3" fill="#7dd3fc" />

    <!-- 🔴 Medium Section Accent -->
    <rect x="34" y="136" width="232" height="88" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="4" />
    <circle cx="58" cy="180" r="14" fill="#ef4444" />
    <text x="58" y="185" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" text-anchor="middle">4</text>
    <rect x="84" y="168" width="140" height="8" rx="4" fill="#ef4444" opacity="0.85" />
    <rect x="84" y="184" width="100" height="6" rx="3" fill="#fca5a5" />

    <!-- 🔘 Hard Section Accent -->
    <rect x="34" y="238" width="232" height="88" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="4" />
    <circle cx="58" cy="282" r="14" fill="#475569" />
    <text x="58" y="287" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" text-anchor="middle">7</text>
    <rect x="84" y="270" width="120" height="8" rx="4" fill="#475569" opacity="0.85" />
    <rect x="84" y="286" width="80" height="6" rx="3" fill="#94a3b8" />
  </g>

  <!-- Big Central Floating Badge with Concept '?' -->
  <g transform="translate(356, 356)">
    <circle cx="0" cy="0" r="64" fill="#0284c7" stroke="#ffffff" stroke-width="8" filter="url(#dropShadow)" />
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" text-anchor="middle">?</text>
  </g>
</svg>
